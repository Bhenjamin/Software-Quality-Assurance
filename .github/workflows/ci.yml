#GitHub Actions workflow for continuous integration (CI) of the StudyRoomBooking project.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOLUTION_FILE: StudyRoomBooking/StudyRoomBooking.slnx
  WEB_PROJECT: StudyRoomBooking/src/StudyRoomBooking.Web
  COVERAGE_MIN: 30

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore

      - name: Run basic lint checks
        run: >
          dotnet format "${{ env.SOLUTION_FILE }}" analyzers
          --severity error
          --verify-no-changes
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test "${{ env.SOLUTION_FILE }}"
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Check code coverage threshold
        shell: bash
        run: |
          coverage_file=$(find TestResults -name coverage.cobertura.xml -print -quit)
          if [ -z "$coverage_file" ]; then
            echo "No Cobertura coverage report found."
            exit 1
          fi

          line_rate=$(grep -o 'line-rate="[0-9.]*"' "$coverage_file" | head -n 1 | cut -d '"' -f 2)
          if [ -z "$line_rate" ]; then
            echo "Could not read line coverage from $coverage_file."
            exit 1
          fi

          coverage_percent=$(awk "BEGIN { printf \"%.1f\", $line_rate * 100 }")
          echo "Line coverage: ${coverage_percent}% (minimum: ${{ env.COVERAGE_MIN }}%)"
          awk "BEGIN { exit !($coverage_percent >= ${{ env.COVERAGE_MIN }}) }"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults
          if-no-files-found: error

  smoke-test:
    name: Smoke test (app starts and responds)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Start the app and check it responds
        env:
          SUPABASE_CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
          ConnectionStrings__Supabase: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          if [ -z "$SUPABASE_CONNECTION_STRING" ]; then
            echo "SUPABASE_CONNECTION_STRING repository secret is not configured."
            exit 1
          fi

          dotnet run \
            --project "${{ env.WEB_PROJECT }}" \
            --configuration Release \
            --no-launch-profile \
            --urls http://localhost:5099 > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5099/ || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed. Application log:"
          cat app.log
          exit 1
